<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción al Periódico</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/app.js"></script>
</head>
<body>

    <div class="container">
        <h2>Suscripción al Diario</h2>
        
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre de usuario:</label>
                <input type="text" id="nombre" name="nombre" oninput="validarUsuario()" placeholder="Ej. Juan Pérez" required>
                <p id="texto1"></p>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" oninput="validarEmail()" placeholder="juan@ejemplo.com" required>
                <p id="texto2"></p>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de contacto:</label>
                <input type="text" id="telefono" name="telefono" oninput="validarTelefono()" placeholder="Ej. 600123456" required>
                <p id="texto3"></p>
            </div>

            <div class="form-group">
                <label for="comunidad">Comunidad Autónoma:</label>
                <select id="comunidad" name="comunidad" onclick="validarSelect()" required>
                    <option value="" disabled selected>Selecciona tu comunidad</option>
                    <option value="andalucia">Andalucía</option>
                    <option value="aragon">Aragón</option>
                    <option value="asturias">Principado de Asturias</option>
                    <option value="baleares">Islas Baleares</option>
                    <option value="canarias">Canarias</option>
                    <option value="cantabria">Cantabria</option>
                    <option value="castillalamancha">Castilla-La Mancha</option>
                    <option value="castillaleon">Castilla y León</option>
                    <option value="cataluna">Cataluña</option>
                    <option value="extremadura">Extremadura</option>
                    <option value="galicia">Galicia</option>
                    <option value="rioja">La Rioja</option>
                    <option value="madrid">Comunidad de Madrid</option>
                    <option value="murcia">Región de Murcia</option>
                    <option value="navarra">Comunidad Foral de Navarra</option>
                    <option value="paisvasco">País Vasco</option>
                    <option value="valencia">Comunidad Valenciana</option>
                    <option value="ceuta">Ceuta</option>
                    <option value="melilla">Melilla</option>
                </select>
            </div>
            <p id="texto4"></p>

            <div class="form-group">
                <label>Temas de interés:</label>
                <div class="checkbox-group" onchange="validarCheckBoxes()">
                    <div class="checkbox-item">
                        <input type="checkbox" id="deportes" name="temas" value="deportes">
                        <label for="deportes" style="margin:0; font-weight:normal;">Deportes</label>
                    </div>
                    
                    <div class="checkbox-item">
                        <input type="checkbox" id="moda" name="temas" value="moda">
                        <label for="moda" style="margin:0; font-weight:normal;">Moda y Estilo</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="politica" name="temas" value="politica">
                        <label for="politica" style="margin:0; font-weight:normal;">Política</label>
                    </div>

                    <div class="checkbox-item">
                        <input type="checkbox" id="tecnologia" name="temas" value="tecnologia">
                        <label for="tecnologia" style="margin:0; font-weight:normal;">Tecnología</label>
                    </div>

                    <div id="nuevos-temas-container">
                    </div>
                </div>

                <div class="add-topic-container" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd;">
    
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="nuevo-tema-texto" placeholder="Nuevo tema..." 
                        style="flex: 1; width: auto; padding: 10px; margin: 0;">
                    
                    <button type="button" onclick="agregarTemaNuevo()" 
                            style="width: auto; padding: 10px 20px; font-size: 14px; background-color: #7f8c8d; margin: 0; white-space: nowrap;">
                        Añadir
                    </button>
                </div>

                <button type="button" onclick="eliminarTemasSeleccionados()" 
                        style="width: 100%; padding: 10px; font-size: 14px; background-color: #c0392b; margin: 0;">
                    Eliminar temas seleccionados
                </button>

            </div>
            </div>
            <p id="texto5"></p>

            <div class="btn-container">
                <button type="submit" class="btn-submit">Enviar</button>
                <button type="reset" class="btn-reset">Borrar (Reset)</button>
            </div>

        </form>
    </div>

</body>
</html>
